services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditflow}
      POSTGRES_DB: auditflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auditflow:${POSTGRES_PASSWORD:-auditflow}@db:5432/auditflow
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - evidence_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  evidence_data:
